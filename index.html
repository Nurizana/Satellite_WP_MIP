<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Satellite GIS Web</title>
    
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Top Legend Panel */
        #legend-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ccc;
            padding: 10px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border-radius: 5px;
        }

        /* Control Panel (Made Smaller) */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px; /* Reduced from 300px */
            max-height: 90vh;
            background: white;
            border: 2px solid #ccc;
            z-index: 1000;
            overflow-y: auto;
            padding: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #control-panel h4 {
            margin-top: 5px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
        }

        /* 4-Column Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        /* Button Styling (Made Smaller) */
        .layer-btn {
            background-color: lightyellow; 
            border: 1px solid #999;
            padding: 5px 2px; /* Reduced padding */
            text-align: center;
            cursor: pointer;
            font-size: 11px; /* Reduced font size */
            transition: background-color 0.3s;
        }

        .layer-btn.active {
            background-color: #8db600; /* Apple Green */
            color: white;
            border-color: #555;
        }

        .layer-btn:hover {
            opacity: 0.8;
        }
        
        /* Optional: Attempt to blend the white background. 
           (Note: Best practice is generating transparent images as advised above) */
        .leaflet-image-layer {
            mix-blend-mode: multiply; /* Helps hide white backgrounds, but darkens colors */
        }
    </style>
</head>
<body>

    <!-- Map Div -->
    <div id="map"></div>

    <!-- Legend Panel at Top -->
    <div id="legend-panel">
        <strong style="font-size: 14px; display: block; margin-bottom: 5px;">Precipitation Legend</strong>
        <!-- Replace 'legend.png' with the URL of your isolated legend image -->
        <!-- Example text placeholder if image is missing -->
        <span style="font-size: 12px; color: #666;">(Blue: Low | Yellow: Med | Red: High)</span>
        <!-- <img src="URL_TO_YOUR_SEPARATE_LEGEND_IMAGE.png" alt="Legend" style="height: 30px;"> -->
    </div>

    <!-- Control Panel Div -->
    <div id="control-panel">
        <h4>Satellite Layers</h4>
        <div class="grid-container" id="button-grid">
            <!-- Buttons generated here -->
        </div>
    </div>

    <!-- Include Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize Map
        var map = L.map('map').setView([0, 100.0], 4);

        // Add ESRI Blue Ocean Basemap
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 13
        }).addTo(map);

        // Add ESRI Blue Ocean Labels
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 13,
            pane: 'markerPane' 
        }).addTo(map);

        // Set Image Bounds: 35S to 35N, 70E to 40W (mapped to 320 for wrap-around)
        var imageBounds = [[-35.0, 70.0], [35.0, 320.0]];
        var activeLayers = {};
        var baseUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data/map_timestep_";

        // Generate Buttons
        var grid = document.getElementById('button-grid');

        for (let i = 0; i < 124; i++) {
            let paddedNum = i.toString().padStart(3, '0');
            let btn = document.createElement('div');
            btn.className = 'layer-btn';
            btn.innerHTML = paddedNum;
            btn.id = 'btn-' + paddedNum;

            btn.addEventListener('click', function() {
                var layerId = paddedNum;
                var imageUrl = baseUrl + layerId + ".png";

                if (activeLayers[layerId]) {
                    map.removeLayer(activeLayers[layerId]);
                    delete activeLayers[layerId];
                    btn.classList.remove('active'); 
                } 
                else {
                    // Added opacity to 0.7 to blend slightly better until you generate transparent images
                    var imageOverlay = L.imageOverlay(imageUrl, imageBounds, {opacity: 0.7}).addTo(map);
                    activeLayers[layerId] = imageOverlay;
                    btn.classList.add('active'); 
                }
            });

            grid.appendChild(btn);
        }
    </script>
</body>
</html>
