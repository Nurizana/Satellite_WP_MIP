<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Satellite GIS Web - Animated GeoTIFF & Rainfall</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Prevent text selection */
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        #map {
            width: 100%;
            flex-grow: 1;
            z-index: 1;
        }

        #chart-container {
            width: 100%;
            height: 30vh;
            background: #fdfdfd;
            border-top: 2px solid #ccc;
            display: none;
            padding: 10px;
            box-sizing: border-box;
            z-index: 1000;
        }

        canvas {
            max-height: 100%;
        }

        #legend-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ccc;
            padding: 10px 15px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border-radius: 5px;
        }

        .legend-gradient {
            background: linear-gradient(to right, #440154, #3b528b, #21918c, #5ec962, #fde725);
            height: 15px;
            width: 250px;
            margin: 5px auto;
            border: 1px solid #666;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            width: 250px;
            margin: 0 auto;
            font-size: 11px;
            color: #333;
            font-weight: bold;
        }

        /* Time display is now integrated inside the legend panel */
        #time-display {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #222;
            padding-top: 8px;
            border-top: 1px dashed #ccc;
        }

        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            max-height: 70vh;
            background: white;
            border: 2px solid #ccc;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .control-section {
            padding: 10px;
            border-bottom: 2px solid #eee;
            background: #f9f9f9;
            text-align: center;
        }

        .control-section:last-child {
            border-bottom: none;
        }
        
        .control-section button {
            cursor: pointer;
            padding: 5px 10px;
            margin: 2px;
            font-size: 12px;
            border: 1px solid #999;
            background: #fff;
            border-radius: 3px;
        }
        
        .control-section button:hover { background: #eee; }
        #btn-play { background: #d4edda !important; font-weight: bold;}
        #btn-stop { background: #f8d7da !important; font-weight: bold;}
        
        /* Specific styling for toggle buttons */
        .btn-toggle {
            width: 90%;
            font-weight: bold;
            margin-bottom: 5px !important;
        }
        
        #btn-toggle-stations {
            background: #e2e3e5;
        }

        #layer-panel {
            padding: 10px;
            overflow-y: auto;
        }

        #layer-panel h4 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        .layer-btn {
            background-color: lightyellow; 
            border: 1px solid #999;
            padding: 5px 2px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .layer-btn.active {
            background-color: #8db600;
            color: white;
            border-color: #555;
        }

        .layer-btn.loading {
            background-color: #ffc107;
            color: black;
            opacity: 0.8;
            cursor: wait;
        }

        /* SECURITY: Completely blank out the page if the user tries to print */
        @media print {
            html, body {
                display: none !important;
                background-color: white !important;
            }
        }
    </style>
</head>
<!-- SECURITY: Disable right click at the body level -->
<body oncontextmenu="return false;">

    <div id="map"></div>

    <div id="chart-container">
        <canvas id="rainfallChart"></canvas>
    </div>

    <!-- Legend Panel now also contains the Valid Time -->
    <div id="legend-panel">
        <strong style="font-size: 14px; display: block;">Total Precipitation (kg m⁻²)</strong>
        <div class="legend-gradient"></div>
        <div class="legend-labels">
            <span>0</span>
            <span>35</span>
            <span>70</span>
            <span>105</span>
            <span>140</span>
        </div>
        <div id="time-display">Valid Time: Select a layer to start</div>
    </div>

    <div id="control-panel">
        <div class="control-section">
            <div style="font-size: 13px; margin-bottom: 5px; font-weight: bold;">Animation Controls</div>
            <button id="btn-play">Play</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-reset">Reset</button>
        </div>
        
        <!-- Consolidated Map Overlays Section -->
        <div class="control-section">
            <div style="font-size: 13px; margin-bottom: 5px; font-weight: bold;">Map Overlays</div>
            <button id="btn-toggle-stations" class="btn-toggle">Hide Stations</button>
            <button id="btn-toggle-grid" class="btn-toggle">Show 5° Grid</button>
        </div>

        <div id="layer-panel">
            <h4>Satellite Layers</h4>
            <div class="grid-container" id="button-grid"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // ==========================================
        // FRONTEND SECURITY MEASURES
        // ==========================================

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 80)) { e.preventDefault(); return false; }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'PrintScreen' || e.keyCode === 44) {
                navigator.clipboard.writeText(''); 
                document.body.style.display = 'none'; 
                setTimeout(() => { document.body.style.display = ''; }, 1500);
            }
        });

        document.addEventListener('dragstart', e => e.preventDefault());

        document.addEventListener('copy', function(e) {
            e.clipboardData.setData('text/plain', 'Content protected.');
            e.preventDefault();
        });

        // ==========================================
        // MAP & DATA LOGIC
        // ==========================================

        var map = L.map('map').setView([4.0, 108.0], 5);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 13
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 13,
            pane: 'markerPane' 
        }).addTo(map);

        // 1. Stations LayerGroup
        var stationsLayerGroup = L.layerGroup().addTo(map);

        // 2. 5-Degree Grid LayerGroup (Not added to map by default)
        var gridLayerGroup = L.layerGroup();
        
        // Base style for the grid (Yellow and thicker)
        var defaultGridStyle = { color: 'yellow', weight: 3, opacity: 0.6, dashArray: '4, 4' };

        // Generate Longitude lines (Meridians) every 5 degrees
        for (let lon = -180; lon <= 180; lon += 5) {
            let lonLine = L.polyline([[ -90, lon ], [ 90, lon ]], defaultGridStyle);
            
            // Format label text nicely
            let labelText = lon === 0 ? "0°" : (lon > 0 ? lon + "° E" : Math.abs(lon) + "° W");
            lonLine.bindTooltip("Longitude: " + labelText, { sticky: true });
            
            // Add hover effects for interactivity
            lonLine.on('mouseover', function(e) {
                this.setStyle({ weight: 7, opacity: 1 }); // Make it significantly thicker on hover
            });
            lonLine.on('mouseout', function(e) {
                this.setStyle(defaultGridStyle); // Revert to base style
            });
            
            lonLine.addTo(gridLayerGroup);
        }
        
        // Generate Latitude lines (Parallels) every 5 degrees
        for (let lat = -90; lat <= 90; lat += 5) {
            let latLine = L.polyline([[ lat, -180 ], [ lat, 180 ]], defaultGridStyle);
            
            // Format label text nicely
            let labelText = lat === 0 ? "Equator (0°)" : (lat > 0 ? lat + "° N" : Math.abs(lat) + "° S");
            latLine.bindTooltip("Latitude: " + labelText, { sticky: true });
            
            // Add hover effects for interactivity
            latLine.on('mouseover', function(e) {
                this.setStyle({ weight: 7, opacity: 1 }); // Make it significantly thicker on hover
            });
            latLine.on('mouseout', function(e) {
                this.setStyle(defaultGridStyle); // Revert to base style
            });
            
            latLine.addTo(gridLayerGroup);
        }

        var baseUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data2/map_timestep_";
        var csvUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data3/Hourly_PMSS_202401_WCoordinate.csv";
        var colorScale = chroma.scale('viridis').domain([0, 140]);
        var layerCache = {}; 
        var totalFrames = 124;

        // Satellite Time settings
        // Frame 0 starts at 2024-01-01 06:00 UTC ("Z")
        var satelliteBaseDate = new Date("2024-01-01T06:00:00Z");

        var isPlaying = false;
        var currentFrame = 0;
        var currentlyDisplayedLayerId = null;
        var animTimeout = null;
        var chartInstance = null;

        // Function to update the Time Display box
        function updateTimeDisplay(frameIndex) {
            // Multiply frameIndex by 6 hours
            var frameDate = new Date(satelliteBaseDate.getTime() + (frameIndex * 6 * 60 * 60 * 1000));
            
            // Using getUTC methods to ensure time displays exactly as Z (UTC) time 
            var year = frameDate.getUTCFullYear();
            var month = String(frameDate.getUTCMonth() + 1).padStart(2, '0');
            var day = String(frameDate.getUTCDate()).padStart(2, '0');
            var hours = String(frameDate.getUTCHours()).padStart(2, '0');
            
            var timeString = `${year}-${month}-${day} ${hours}:00Z`;
            document.getElementById('time-display').innerText = "Valid Time: " + timeString;
        }

        function loadAndShowLayer(layerId, btn, isAnimContext = false, callback = null) {
            if (layerCache[layerId]) {
                if (!map.hasLayer(layerCache[layerId])) {
                    layerCache[layerId].addTo(map);
                    btn.classList.add('active');
                }
                updateTimeDisplay(parseInt(layerId));
                if (callback) callback(layerCache[layerId]);
                return;
            }

            btn.classList.add('loading');
            var tiffUrl = baseUrl + layerId + ".tif";
            
            fetch(tiffUrl)
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => parseGeoraster(arrayBuffer))
                .then(georaster => {
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: 0.8,
                        resolution: 128,
                        pixelValuesToColorFn: function(pixelValues) {
                            var val = pixelValues[0];
                            if (val === undefined || val === null || isNaN(val) || val <= 0.1) return null;
                            return colorScale(val).hex();
                        }
                    });
                    
                    layerCache[layerId] = layer;
                    btn.classList.remove('loading');
                    
                    if (!isAnimContext || isPlaying) {
                        layer.addTo(map);
                        btn.classList.add('active');
                        updateTimeDisplay(parseInt(layerId));
                    }
                    if (callback) callback(layer);
                })
                .catch(error => {
                    console.error('Error fetching layer:', error);
                    btn.classList.remove('loading');
                    if (callback) callback(null);
                });
        }

        function stepAnimation() {
            if (!isPlaying) return;
            if (currentFrame >= totalFrames) {
                stopAnimation();
                return;
            }

            var layerId = currentFrame.toString().padStart(3, '0');
            var btn = document.getElementById('btn-' + layerId);

            loadAndShowLayer(layerId, btn, true, function(loadedLayer) {
                if (!isPlaying) return; 
                
                if (currentlyDisplayedLayerId !== null && currentlyDisplayedLayerId !== layerId) {
                    var prevBtn = document.getElementById('btn-' + currentlyDisplayedLayerId);
                    if (prevBtn && layerCache[currentlyDisplayedLayerId]) {
                        map.removeLayer(layerCache[currentlyDisplayedLayerId]);
                        prevBtn.classList.remove('active');
                    }
                }

                currentlyDisplayedLayerId = layerId;
                currentFrame++;
                animTimeout = setTimeout(stepAnimation, 800); 
            });
        }

        function playAnimation() {
            if (isPlaying) return;
            isPlaying = true;
            if (currentFrame >= totalFrames) currentFrame = 0; 
            stepAnimation();
        }

        function stopAnimation() {
            isPlaying = false;
            clearTimeout(animTimeout);
        }

        function resetAnimation() {
            stopAnimation();
            for (let i = 0; i < totalFrames; i++) {
                let id = i.toString().padStart(3, '0');
                if (layerCache[id] && map.hasLayer(layerCache[id])) {
                    map.removeLayer(layerCache[id]);
                }
                let btn = document.getElementById('btn-' + id);
                if (btn) btn.classList.remove('active');
            }
            currentlyDisplayedLayerId = null;
            currentFrame = 0;
            document.getElementById('time-display').innerText = "Valid Time: Select a layer to start";
        }

        document.getElementById('btn-play').addEventListener('click', playAnimation);
        document.getElementById('btn-stop').addEventListener('click', stopAnimation);
        document.getElementById('btn-reset').addEventListener('click', resetAnimation);

        // Logic for the Station Toggle Button
        var btnToggleStations = document.getElementById('btn-toggle-stations');
        btnToggleStations.addEventListener('click', function() {
            if (map.hasLayer(stationsLayerGroup)) {
                map.removeLayer(stationsLayerGroup);
                btnToggleStations.innerText = "Show Stations";
                btnToggleStations.style.background = "#fff";
            } else {
                map.addLayer(stationsLayerGroup);
                btnToggleStations.innerText = "Hide Stations";
                btnToggleStations.style.background = "#e2e3e5";
            }
        });

        // Logic for the Grid Toggle Button
        var btnToggleGrid = document.getElementById('btn-toggle-grid');
        btnToggleGrid.addEventListener('click', function() {
            if (map.hasLayer(gridLayerGroup)) {
                map.removeLayer(gridLayerGroup);
                btnToggleGrid.innerText = "Show 5° Grid";
                btnToggleGrid.style.background = "#fff";
            } else {
                map.addLayer(gridLayerGroup);
                btnToggleGrid.innerText = "Hide 5° Grid";
                btnToggleGrid.style.background = "#e2e3e5";
            }
        });

        var grid = document.getElementById('button-grid');
        for (let i = 0; i < totalFrames; i++) {
            let paddedNum = i.toString().padStart(3, '0');
            let btn = document.createElement('div');
            btn.className = 'layer-btn';
            btn.innerHTML = paddedNum;
            btn.id = 'btn-' + paddedNum;

            btn.addEventListener('click', function() {
                if (isPlaying) stopAnimation();
                var layerId = paddedNum;
                if (layerCache[layerId] && map.hasLayer(layerCache[layerId])) {
                    map.removeLayer(layerCache[layerId]);
                    btn.classList.remove('active');
                } else {
                    loadAndShowLayer(layerId, btn, false);
                }
            });
            grid.appendChild(btn);
        }

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                let data = results.data;
                let stations = {};

                data.forEach(row => {
                    let name = row['STATION NAME'];
                    if (!name) return;

                    if (!stations[name]) {
                        stations[name] = {
                            lat: parseFloat(row['LATITUDE']),
                            lon: parseFloat(row['LONGITUDE']),
                            records: []
                        };
                    }
                    
                    let timeStr = `${row['YEAR']}-${row['MTH'].padStart(2,'0')}-${row['DAY'].padStart(2,'0')} ${row['HOUR'].padStart(2,'0')}:00`;
                    
                    let rainVal = parseFloat(row['RAIN']);
                    if (rainVal === -99.9) {
                        rainVal = null; 
                    } else {
                        rainVal = isNaN(rainVal) ? 0 : rainVal;
                    }
                    
                    stations[name].records.push({ time: timeStr, rain: rainVal });
                });

                for (let stn in stations) {
                    let stnData = stations[stn];
                    
                    if (isNaN(stnData.lat) || isNaN(stnData.lon)) continue; 

                    let marker = L.marker([stnData.lat, stnData.lon]).addTo(stationsLayerGroup);
                    marker.bindTooltip(stn); 

                    marker.on('click', function() {
                        generateChart(stn, stnData.records);
                    });
                }
            }
        });

        function aggregate6Hourly(records) {
            let accumulated = [];
            let currentWindowStart = null;
            let currentSum = 0;
            let hasNullInWindow = false;

            records.forEach(rec => {
                let d = new Date(rec.time.replace(' ', 'T'));
                
                let windowHour = Math.floor(d.getHours() / 6) * 6;
                let windowStart = new Date(d);
                windowStart.setHours(windowHour, 0, 0, 0);

                let windowLabel = windowStart.getFullYear() + '-' + 
                                  String(windowStart.getMonth() + 1).padStart(2, '0') + '-' + 
                                  String(windowStart.getDate()).padStart(2, '0') + ' ' + 
                                  String(windowStart.getHours()).padStart(2, '0') + ':00';

                if (currentWindowStart !== null && currentWindowStart !== windowLabel) {
                    accumulated.push({
                        time: currentWindowStart,
                        rain: hasNullInWindow ? null : parseFloat(currentSum.toFixed(2))
                    });
                    
                    currentSum = 0;
                    hasNullInWindow = false;
                }
                
                currentWindowStart = windowLabel;

                if (rec.rain === null) {
                    hasNullInWindow = true;
                } else {
                    currentSum += rec.rain;
                }
            });

            if (currentWindowStart !== null) {
                accumulated.push({
                    time: currentWindowStart,
                    rain: hasNullInWindow ? null : parseFloat(currentSum.toFixed(2))
                });
            }

            return accumulated;
        }

        function generateChart(stationName, hourlyRecords) {
            hourlyRecords.sort((a, b) => new Date(a.time.replace(' ', 'T')) - new Date(b.time.replace(' ', 'T')));
            
            let sixHourlyRecords = aggregate6Hourly(hourlyRecords);

            let labels = sixHourlyRecords.map(r => r.time);
            let rainData = sixHourlyRecords.map(r => r.rain);

            let container = document.getElementById('chart-container');
            if(container.style.display !== 'block') {
                container.style.display = 'block';
                map.invalidateSize();
            }

            if (chartInstance) {
                chartInstance.destroy(); 
            }

            let ctx = document.getElementById('rainfallChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `6-Hourly Accumulated Rainfall (mm) - ${stationName}`,
                        data: rainData,
                        spanGaps: false, 
                        borderColor: '#21918c',
                        backgroundColor: 'rgba(33, 145, 140, 0.4)',
                        borderWidth: 2,
                        pointRadius: 3,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                title: function(tooltipItems) {
                                    let startTimeStr = tooltipItems[0].label; 
                                    let startDateObj = new Date(startTimeStr.replace(' ', 'T') + ':00Z');
                                    let endDateObj = new Date(startDateObj.getTime() + (6 * 60 * 60 * 1000));
                                    
                                    let formatTime = (d) => String(d.getUTCHours()).padStart(2, '0') + ':00';
                                    let formatDate = (d) => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
                                    
                                    let startD = formatDate(startDateObj);
                                    let startT = formatTime(startDateObj);
                                    let endD = formatDate(endDateObj);
                                    let endT = formatTime(endDateObj);
                                    
                                    if (startD === endD) {
                                        return `Date: ${startD}\nTime: ${startT} - ${endT} (UTC)`;
                                    } else {
                                        return `Start: ${startD} ${startT} (UTC)\nEnd: ${endD} ${endT} (UTC)`;
                                    }
                                },
                                label: function(context) {
                                    let station = context.dataset.label.split(' - ')[1] || 'Station';
                                    return `Station: ${station}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Time (6-Hourly)' },
                            ticks: { maxTicksLimit: 12 }
                        },
                        y: {
                            title: { display: true, text: 'Rainfall (mm)' },
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
