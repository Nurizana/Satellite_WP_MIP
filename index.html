<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Satellite GIS Web - Animated GeoTIFF</title>
    
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Top Legend Panel */
        #legend-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ccc;
            padding: 10px 15px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border-radius: 5px;
        }

        .legend-gradient {
            background: linear-gradient(to right, #440154, #3b528b, #21918c, #5ec962, #fde725);
            height: 15px;
            width: 250px;
            margin: 5px auto;
            border: 1px solid #666;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            width: 250px;
            margin: 0 auto;
            font-size: 11px;
            color: #333;
            font-weight: bold;
        }

        /* Control Panel */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            max-height: 90vh;
            background: white;
            border: 2px solid #ccc;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Animation Controls */
        #anim-panel {
            padding: 10px;
            border-bottom: 2px solid #eee;
            background: #f9f9f9;
            text-align: center;
        }
        
        #anim-panel button {
            cursor: pointer;
            padding: 5px 10px;
            margin: 2px;
            font-size: 12px;
            border: 1px solid #999;
            background: #fff;
            border-radius: 3px;
        }
        
        #anim-panel button:hover {
            background: #eee;
        }
        
        #btn-play { background: #d4edda !important; font-weight: bold;}
        #btn-stop { background: #f8d7da !important; font-weight: bold;}

        /* Layer Grid Panel */
        #layer-panel {
            padding: 10px;
            overflow-y: auto;
        }

        #layer-panel h4 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        /* Button Styling */
        .layer-btn {
            background-color: lightyellow; 
            border: 1px solid #999;
            padding: 5px 2px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .layer-btn.active {
            background-color: #8db600; /* Apple Green */
            color: white;
            border-color: #555;
        }

        .layer-btn.loading {
            background-color: #ffc107; /* Warning Yellow for loading */
            color: black;
            opacity: 0.8;
            cursor: wait;
        }
    </style>
</head>
<body>

    <!-- Map Div -->
    <div id="map"></div>

    <!-- Legend Panel -->
    <div id="legend-panel">
        <strong style="font-size: 14px; display: block;">Total Precipitation (kg m⁻²)</strong>
        <div class="legend-gradient"></div>
        <div class="legend-labels">
            <span>0</span>
            <span>35</span>
            <span>70</span>
            <span>105</span>
            <span>140</span>
        </div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel">
        <div id="anim-panel">
            <div style="font-size: 13px; margin-bottom: 5px; font-weight: bold;">Animation Controls</div>
            <button id="btn-play">Play</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-reset">Reset</button>
        </div>
        <div id="layer-panel">
            <h4>Satellite Layers</h4>
            <div class="grid-container" id="button-grid">
                <!-- Buttons generated here -->
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

    <script>
        // Initialize Map
        var map = L.map('map').setView([-10, 140.0], 3);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 13
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 13,
            pane: 'markerPane' 
        }).addTo(map);

        // Core Variables
        var baseUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data2/map_timestep_";
        var colorScale = chroma.scale('viridis').domain([0, 140]);
        var layerCache = {}; // Caches parsed TIFFs for fast replays
        var totalFrames = 124;

        // Animation Variables
        var isPlaying = false;
        var currentFrame = 0;
        var currentlyDisplayedLayerId = null;
        var animTimeout = null;

        // --- Core Load Function ---
        function loadAndShowLayer(layerId, btn, isAnimContext = false, callback = null) {
            // If already parsed in cache
            if (layerCache[layerId]) {
                if (!map.hasLayer(layerCache[layerId])) {
                    layerCache[layerId].addTo(map);
                    btn.classList.add('active');
                }
                if (callback) callback(layerCache[layerId]);
                return;
            }

            // Fetch and parse if not in cache
            btn.classList.add('loading');
            var tiffUrl = baseUrl + layerId + ".tif";
            
            fetch(tiffUrl)
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => parseGeoraster(arrayBuffer))
                .then(georaster => {
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: 0.8,
                        resolution: 128, // Lower resolution for faster parsing during animation
                        pixelValuesToColorFn: function(pixelValues) {
                            var val = pixelValues[0];
                            if (val === undefined || val === null || isNaN(val) || val <= 0.1) return null;
                            return colorScale(val).hex();
                        }
                    });
                    
                    layerCache[layerId] = layer;
                    btn.classList.remove('loading');
                    
                    // Only add to map if animation wasn't stopped during fetch
                    if (!isAnimContext || isPlaying) {
                        layer.addTo(map);
                        btn.classList.add('active');
                    }
                    if (callback) callback(layer);
                })
                .catch(error => {
                    console.error('Error fetching layer:', error);
                    btn.classList.remove('loading');
                    if (callback) callback(null);
                });
        }

        // --- Animation Functions ---
        function stepAnimation() {
            if (!isPlaying) return;
            if (currentFrame >= totalFrames) {
                stopAnimation();
                return;
            }

            var layerId = currentFrame.toString().padStart(3, '0');
            var btn = document.getElementById('btn-' + layerId);

            loadAndShowLayer(layerId, btn, true, function(loadedLayer) {
                if (!isPlaying) return; // double check after async load
                
                // Hide the previous frame in the sequence
                if (currentlyDisplayedLayerId !== null && currentlyDisplayedLayerId !== layerId) {
                    var prevBtn = document.getElementById('btn-' + currentlyDisplayedLayerId);
                    if (prevBtn && layerCache[currentlyDisplayedLayerId]) {
                        map.removeLayer(layerCache[currentlyDisplayedLayerId]);
                        prevBtn.classList.remove('active');
                    }
                }

                currentlyDisplayedLayerId = layerId;
                currentFrame++;
                
                // Set delay before next frame (adjustable speed)
                animTimeout = setTimeout(stepAnimation, 800); 
            });
        }

        function playAnimation() {
            if (isPlaying) return;
            isPlaying = true;
            if (currentFrame >= totalFrames) currentFrame = 0; // restart if at end
            stepAnimation();
        }

        function stopAnimation() {
            isPlaying = false;
            clearTimeout(animTimeout);
        }

        function resetAnimation() {
            stopAnimation();
            
            // Remove all active layers from map and reset buttons
            for (let i = 0; i < totalFrames; i++) {
                let id = i.toString().padStart(3, '0');
                if (layerCache[id] && map.hasLayer(layerCache[id])) {
                    map.removeLayer(layerCache[id]);
                }
                let btn = document.getElementById('btn-' + id);
                if (btn) btn.classList.remove('active');
            }
            
            currentlyDisplayedLayerId = null;
            currentFrame = 0;
        }

        // --- Event Listeners for Controls ---
        document.getElementById('btn-play').addEventListener('click', playAnimation);
        document.getElementById('btn-stop').addEventListener('click', stopAnimation);
        document.getElementById('btn-reset').addEventListener('click', resetAnimation);

        // --- Generate Grid Buttons ---
        var grid = document.getElementById('button-grid');
        for (let i = 0; i < totalFrames; i++) {
            let paddedNum = i.toString().padStart(3, '0');
            let btn = document.createElement('div');
            btn.className = 'layer-btn';
            btn.innerHTML = paddedNum;
            btn.id = 'btn-' + paddedNum;

            btn.addEventListener('click', function() {
                // If clicked manually during animation, pause animation
                if (isPlaying) stopAnimation();

                var layerId = paddedNum;
                
                // Toggle Logic
                if (layerCache[layerId] && map.hasLayer(layerCache[layerId])) {
                    map.removeLayer(layerCache[layerId]);
                    btn.classList.remove('active');
                } else {
                    loadAndShowLayer(layerId, btn, false);
                }
            });

            grid.appendChild(btn);
        }
    </script>
</body>
</html>
