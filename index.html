<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Satellite GIS Web - Animated GeoTIFF & Rainfall</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Prevent text selection */
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        #map {
            width: 100%;
            flex-grow: 1;
            z-index: 1;
        }

        #chart-container {
            width: 100%;
            height: 30vh;
            background: #fdfdfd;
            border-top: 2px solid #ccc;
            display: none;
            padding: 10px;
            box-sizing: border-box;
            z-index: 1000;
        }

        canvas {
            max-height: 100%;
        }

        #legend-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ccc;
            padding: 10px 15px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border-radius: 5px;
        }

        .legend-gradient {
            background: linear-gradient(to right, #440154, #3b528b, #21918c, #5ec962, #fde725);
            height: 15px;
            width: 250px;
            margin: 5px auto;
            border: 1px solid #666;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            width: 250px;
            margin: 0 auto;
            font-size: 11px;
            color: #333;
            font-weight: bold;
        }

        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            max-height: 60vh;
            background: white;
            border: 2px solid #ccc;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #anim-panel {
            padding: 10px;
            border-bottom: 2px solid #eee;
            background: #f9f9f9;
            text-align: center;
        }
        
        #anim-panel button {
            cursor: pointer;
            padding: 5px 10px;
            margin: 2px;
            font-size: 12px;
            border: 1px solid #999;
            background: #fff;
            border-radius: 3px;
        }
        
        #anim-panel button:hover { background: #eee; }
        #btn-play { background: #d4edda !important; font-weight: bold;}
        #btn-stop { background: #f8d7da !important; font-weight: bold;}

        #layer-panel {
            padding: 10px;
            overflow-y: auto;
        }

        #layer-panel h4 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        .layer-btn {
            background-color: lightyellow; 
            border: 1px solid #999;
            padding: 5px 2px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .layer-btn.active {
            background-color: #8db600;
            color: white;
            border-color: #555;
        }

        .layer-btn.loading {
            background-color: #ffc107;
            color: black;
            opacity: 0.8;
            cursor: wait;
        }

        /* SECURITY: Completely blank out the page if the user tries to print */
        @media print {
            html, body {
                display: none !important;
                background-color: white !important;
            }
        }
    </style>
</head>
<!-- SECURITY: Disable right click at the body level -->
<body oncontextmenu="return false;">

    <div id="map"></div>

    <div id="chart-container">
        <canvas id="rainfallChart"></canvas>
    </div>

    <div id="legend-panel">
        <strong style="font-size: 14px; display: block;">Total Precipitation (kg m⁻²)</strong>
        <div class="legend-gradient"></div>
        <div class="legend-labels">
            <span>0</span>
            <span>35</span>
            <span>70</span>
            <span>105</span>
            <span>140</span>
        </div>
    </div>

    <div id="control-panel">
        <div id="anim-panel">
            <div style="font-size: 13px; margin-bottom: 5px; font-weight: bold;">Animation Controls</div>
            <button id="btn-play">Play</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-reset">Reset</button>
        </div>
        <div id="layer-panel">
            <h4>Satellite Layers</h4>
            <div class="grid-container" id="button-grid"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // ==========================================
        // FRONTEND SECURITY MEASURES
        // ==========================================

        // 1. Prevent Right Click (Context Menu)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Prevent Keyboard Shortcuts (F12, Ctrl+U, Ctrl+Shift+I, Ctrl+S, Ctrl+P)
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I (DevTools), Ctrl+Shift+J, Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (View Source), Ctrl+S (Save), Ctrl+P (Print)
            if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 80)) {
                e.preventDefault();
                return false;
            }
        });

        // 3. Print Screen Obfuscation (Attempts to clear clipboard and blank screen temporarily)
        document.addEventListener('keyup', function(e) {
            if (e.key === 'PrintScreen' || e.keyCode === 44) {
                navigator.clipboard.writeText(''); // Attempt to clear clipboard
                document.body.style.display = 'none'; // Blank screen
                setTimeout(() => {
                    document.body.style.display = ''; // Restore screen after a short delay
                }, 1500);
            }
        });

        // 4. Prevent Drag and Drop (stops pulling images/data out)
        document.addEventListener('dragstart', e => e.preventDefault());

        // 5. Override Copy event
        document.addEventListener('copy', function(e) {
            e.clipboardData.setData('text/plain', 'Content protected.');
            e.preventDefault();
        });

        // ==========================================
        // MAP & DATA LOGIC
        // ==========================================

        var map = L.map('map').setView([4.0, 108.0], 5);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 13
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 13,
            pane: 'markerPane' 
        }).addTo(map);

        var baseUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data2/map_timestep_";
        var csvUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data3/Hourly_PMSS_202401_WCoordinate.csv";
        var colorScale = chroma.scale('viridis').domain([0, 140]);
        var layerCache = {}; 
        var totalFrames = 124;

        var isPlaying = false;
        var currentFrame = 0;
        var currentlyDisplayedLayerId = null;
        var animTimeout = null;
        var chartInstance = null;

        function loadAndShowLayer(layerId, btn, isAnimContext = false, callback = null) {
            if (layerCache[layerId]) {
                if (!map.hasLayer(layerCache[layerId])) {
                    layerCache[layerId].addTo(map);
                    btn.classList.add('active');
                }
                if (callback) callback(layerCache[layerId]);
                return;
            }

            btn.classList.add('loading');
            var tiffUrl = baseUrl + layerId + ".tif";
            
            fetch(tiffUrl)
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => parseGeoraster(arrayBuffer))
                .then(georaster => {
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: 0.8,
                        resolution: 128,
                        pixelValuesToColorFn: function(pixelValues) {
                            var val = pixelValues[0];
                            if (val === undefined || val === null || isNaN(val) || val <= 0.1) return null;
                            return colorScale(val).hex();
                        }
                    });
                    
                    layerCache[layerId] = layer;
                    btn.classList.remove('loading');
                    
                    if (!isAnimContext || isPlaying) {
                        layer.addTo(map);
                        btn.classList.add('active');
                    }
                    if (callback) callback(layer);
                })
                .catch(error => {
                    console.error('Error fetching layer:', error);
                    btn.classList.remove('loading');
                    if (callback) callback(null);
                });
        }

        function stepAnimation() {
            if (!isPlaying) return;
            if (currentFrame >= totalFrames) {
                stopAnimation();
                return;
            }

            var layerId = currentFrame.toString().padStart(3, '0');
            var btn = document.getElementById('btn-' + layerId);

            loadAndShowLayer(layerId, btn, true, function(loadedLayer) {
                if (!isPlaying) return; 
                
                if (currentlyDisplayedLayerId !== null && currentlyDisplayedLayerId !== layerId) {
                    var prevBtn = document.getElementById('btn-' + currentlyDisplayedLayerId);
                    if (prevBtn && layerCache[currentlyDisplayedLayerId]) {
                        map.removeLayer(layerCache[currentlyDisplayedLayerId]);
                        prevBtn.classList.remove('active');
                    }
                }

                currentlyDisplayedLayerId = layerId;
                currentFrame++;
                animTimeout = setTimeout(stepAnimation, 800); 
            });
        }

        function playAnimation() {
            if (isPlaying) return;
            isPlaying = true;
            if (currentFrame >= totalFrames) currentFrame = 0; 
            stepAnimation();
        }

        function stopAnimation() {
            isPlaying = false;
            clearTimeout(animTimeout);
        }

        function resetAnimation() {
            stopAnimation();
            for (let i = 0; i < totalFrames; i++) {
                let id = i.toString().padStart(3, '0');
                if (layerCache[id] && map.hasLayer(layerCache[id])) {
                    map.removeLayer(layerCache[id]);
                }
                let btn = document.getElementById('btn-' + id);
                if (btn) btn.classList.remove('active');
            }
            currentlyDisplayedLayerId = null;
            currentFrame = 0;
        }

        document.getElementById('btn-play').addEventListener('click', playAnimation);
        document.getElementById('btn-stop').addEventListener('click', stopAnimation);
        document.getElementById('btn-reset').addEventListener('click', resetAnimation);

        var grid = document.getElementById('button-grid');
        for (let i = 0; i < totalFrames; i++) {
            let paddedNum = i.toString().padStart(3, '0');
            let btn = document.createElement('div');
            btn.className = 'layer-btn';
            btn.innerHTML = paddedNum;
            btn.id = 'btn-' + paddedNum;

            btn.addEventListener('click', function() {
                if (isPlaying) stopAnimation();
                var layerId = paddedNum;
                if (layerCache[layerId] && map.hasLayer(layerCache[layerId])) {
                    map.removeLayer(layerCache[layerId]);
                    btn.classList.remove('active');
                } else {
                    loadAndShowLayer(layerId, btn, false);
                }
            });
            grid.appendChild(btn);
        }

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                let data = results.data;
                let stations = {};

                data.forEach(row => {
                    let name = row['STATION NAME'];
                    if (!name) return;

                    if (!stations[name]) {
                        stations[name] = {
                            lat: parseFloat(row['LATITUDE']),
                            lon: parseFloat(row['LONGITUDE']),
                            records: []
                        };
                    }
                    
                    let timeStr = `${row['YEAR']}-${row['MTH'].padStart(2,'0')}-${row['DAY'].padStart(2,'0')} ${row['HOUR'].padStart(2,'0')}:00`;
                    let rainVal = parseFloat(row['RAIN']);
                    rainVal = isNaN(rainVal) ? 0 : rainVal;
                    
                    stations[name].records.push({ time: timeStr, rain: rainVal });
                });

                for (let stn in stations) {
                    let stnData = stations[stn];
                    
                    if (isNaN(stnData.lat) || isNaN(stnData.lon)) continue; 

                    let marker = L.marker([stnData.lat, stnData.lon]).addTo(map);
                    marker.bindTooltip(stn); 

                    marker.on('click', function() {
                        generateChart(stn, stnData.records);
                    });
                }
            }
        });

        function generateChart(stationName, records) {
            records.sort((a, b) => new Date(a.time) - new Date(b.time));

            let labels = records.map(r => r.time);
            let rainData = records.map(r => r.rain);

            let container = document.getElementById('chart-container');
            if(container.style.display !== 'block') {
                container.style.display = 'block';
                map.invalidateSize();
            }

            if (chartInstance) {
                chartInstance.destroy(); 
            }

            let ctx = document.getElementById('rainfallChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `Hourly Rainfall (mm) - ${stationName}`,
                        data: rainData,
                        borderColor: '#21918c',
                        backgroundColor: 'rgba(33, 145, 140, 0.2)',
                        borderWidth: 2,
                        pointRadius: 2,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Time' },
                            ticks: { maxTicksLimit: 12 }
                        },
                        y: {
                            title: { display: true, text: 'Rainfall (mm)' },
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
