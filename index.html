<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Satellite GIS Web - GeoTIFF Version</title>
    
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Top Legend Panel */
        #legend-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #ccc;
            padding: 10px 15px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border-radius: 5px;
        }

        .legend-gradient {
            /* Viridis color scale representation */
            background: linear-gradient(to right, #440154, #3b528b, #21918c, #5ec962, #fde725);
            height: 15px;
            width: 250px;
            margin: 5px auto;
            border: 1px solid #666;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            width: 250px;
            margin: 0 auto;
            font-size: 11px;
            color: #333;
            font-weight: bold;
        }

        /* Control Panel */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            max-height: 90vh;
            background: white;
            border: 2px solid #ccc;
            z-index: 1000;
            overflow-y: auto;
            padding: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #control-panel h4 {
            margin-top: 5px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
        }

        /* 4-Column Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        /* Button Styling */
        .layer-btn {
            background-color: lightyellow; 
            border: 1px solid #999;
            padding: 5px 2px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            transition: background-color 0.3s, opacity 0.3s;
        }

        .layer-btn.active {
            background-color: #8db600; /* Apple Green */
            color: white;
            border-color: #555;
        }

        .layer-btn:hover {
            opacity: 0.8;
        }
        
        .loading {
            opacity: 0.5;
            cursor: wait;
        }
    </style>
</head>
<body>

    <!-- Map Div -->
    <div id="map"></div>

    <!-- Legend Panel at Top -->
    <div id="legend-panel">
        <strong style="font-size: 14px; display: block;">Total Precipitation (kg m⁻²)</strong>
        <div class="legend-gradient"></div>
        <div class="legend-labels">
            <span>0</span>
            <span>35</span>
            <span>70</span>
            <span>105</span>
            <span>140</span>
        </div>
    </div>

    <!-- Control Panel Div -->
    <div id="control-panel">
        <h4>Satellite Layers</h4>
        <div class="grid-container" id="button-grid">
            <!-- Buttons generated here -->
        </div>
    </div>

    <!-- Include Leaflet, GeoRaster, and Chroma JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

    <script>
        // Initialize Map
        var map = L.map('map').setView([-10, 140.0], 3);

        // Add ESRI Blue Ocean Basemap
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 13
        }).addTo(map);

        // Add ESRI Blue Ocean Labels
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 13,
            pane: 'markerPane' 
        }).addTo(map);

        // Initialize Variables
        var activeLayers = {};
        // Pointing to the new 'Data2' folder containing the .tif files
        var baseUrl = "https://raw.githubusercontent.com/Nurizana/Satellite_WP_MIP/main/Data2/map_timestep_";
        
        // Setup Viridis color scale from 0 to 140
        var colorScale = chroma.scale('viridis').domain([0, 140]);

        // Generate Buttons
        var grid = document.getElementById('button-grid');

        for (let i = 0; i < 124; i++) {
            let paddedNum = i.toString().padStart(3, '0');
            let btn = document.createElement('div');
            btn.className = 'layer-btn';
            btn.innerHTML = paddedNum;
            btn.id = 'btn-' + paddedNum;

            btn.addEventListener('click', function() {
                var layerId = paddedNum;
                var tiffUrl = baseUrl + layerId + ".tif";

                if (activeLayers[layerId]) {
                    // Turn layer off
                    map.removeLayer(activeLayers[layerId]);
                    delete activeLayers[layerId];
                    btn.classList.remove('active'); 
                } 
                else {
                    // Turn layer on & fetch GeoTIFF
                    btn.classList.add('loading');
                    btn.innerHTML = '...';

                    fetch(tiffUrl)
                        .then(response => response.arrayBuffer())
                        .then(arrayBuffer => {
                            parseGeoraster(arrayBuffer).then(georaster => {
                                
                                var layer = new GeoRasterLayer({
                                    georaster: georaster,
                                    opacity: 0.8,
                                    resolution: 256, // Lower resolution for better web performance
                                    pixelValuesToColorFn: function(pixelValues) {
                                        var val = pixelValues[0];
                                        
                                        // Ignore empty pixels or 0 values to make background transparent
                                        if (val === undefined || val === null || isNaN(val) || val <= 0.1) {
                                            return null;
                                        }
                                        
                                        // Apply the viridis color scale to the value
                                        return colorScale(val).hex();
                                    }
                                });

                                layer.addTo(map);
                                activeLayers[layerId] = layer;
                                
                                // Update button UI
                                btn.classList.remove('loading');
                                btn.classList.add('active'); 
                                btn.innerHTML = layerId;
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching the GeoTIFF:', error);
                            btn.classList.remove('loading');
                            btn.innerHTML = layerId;
                            alert("Failed to load map_timestep_" + layerId + ".tif");
                        });
                }
            });

            grid.appendChild(btn);
        }
    </script>
</body>
</html>
